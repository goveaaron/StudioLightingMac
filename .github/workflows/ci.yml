name: CI

on:
  push:
    branches: ['**']
    # Docs-only pushes don't need the (shared, limited) macOS runners.
    paths-ignore: ['docs/**', '*.md']
  workflow_dispatch:
    inputs:
      release:
        description: Publish a GitHub release from this commit
        type: boolean
        default: false
      prerelease:
        description: Mark it as a pre-release (the installer keeps using the latest full release)
        type: boolean
        default: false

concurrency:
  # Per event type, so a push landing on main can't cancel a pending manual (release) run.
  group: ci-${{ github.ref }}-${{ github.event_name }}
  # Agent branches: newer pushes supersede older runs. main: every landing gets a full run.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

env:
  PRISM_VERSION: 0.9.${{ github.run_number }}
  PRISM_BUILD: ${{ github.run_number }}

jobs:
  linux:
    name: Linux · core + server
    runs-on: ubuntu-latest
    container: swift:6.3
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: linux-spm-${{ hashFiles('Package.resolved') }}-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test --skip-build
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: .build
          key: linux-spm-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  macos:
    name: macOS · app
    runs-on: macos-26
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          swift --version
          sw_vers
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: macos-spm-${{ hashFiles('Package.resolved') }}-
      - name: Build (debug + tests)
        run: swift build --build-tests
      - name: Unit tests
        run: swift test --skip-build
      - name: Signing identity
        env:
          PRISM_SIGNING_P12: ${{ secrets.PRISM_SIGNING_P12 }}
          PRISM_SIGNING_PASSWORD: ${{ secrets.PRISM_SIGNING_PASSWORD }}
        run: scripts/ci-import-signing.sh
      - name: Bundle app
        run: scripts/build_app.sh --version "$PRISM_VERSION" --build "$PRISM_BUILD"
      - name: Self-test
        run: scripts/mac-timeout.sh 300 dist/Prism.app/Contents/MacOS/Prism --self-test
      - name: Screenshot tour
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          scripts/mac-timeout.sh 900 dist/Prism.app/Contents/MacOS/Prism --screenshot-tour "$RUNNER_TEMP/shots"
      - name: Full-screen capture
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          dist/Prism.app/Contents/MacOS/Prism --demo --no-hardware > "$RUNNER_TEMP/shots/zz-launch.log" 2>&1 &
          PID=$!
          sleep 15
          screencapture -x "$RUNNER_TEMP/shots/zz-fullscreen.png" || true
          kill -TERM $PID 2>/dev/null || true
          sleep 2
          kill -KILL $PID 2>/dev/null || true
      - name: Crash reports
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/shots/crashes"
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name 'Prism*' -mmin -90 2>/dev/null | while read -r f; do
            cp "$f" "$RUNNER_TEMP/shots/crashes/" || true
            echo "===== $f"; head -c 12000 "$f"; echo
          done
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
          retention-days: 10
          if-no-files-found: ignore
      - name: Package debug app for launch tests
        if: github.ref == 'refs/heads/main'
        run: ditto -c -k --keepParent dist/Prism.app "$RUNNER_TEMP/Prism-debug.zip"
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: prism-debug-app
          path: ${{ runner.temp }}/Prism-debug.zip
          retention-days: 3
      - uses: actions/cache/save@v4
        if: github.ref == 'refs/heads/main'
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}-${{ github.sha }}

  # The app is built on macOS 26 with a macOS 14 deployment target: make sure it really
  # launches and passes its self-test on an older system (weak-linked frameworks etc.).
  # (GitHub retired the macos-14 image in 2026, so macOS 15 is the oldest we can run.)
  launch-older-macos:
    name: Launch · ${{ matrix.os }}
    needs: macos
    if: github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: prism-debug-app
          path: ${{ runner.temp }}
      - name: Unpack
        run: ditto -x -k "$RUNNER_TEMP/Prism-debug.zip" dist && sw_vers
      - name: Self-test
        run: scripts/mac-timeout.sh 300 dist/Prism.app/Contents/MacOS/Prism --self-test
      - name: Screenshot tour
        if: success() || failure()
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          scripts/mac-timeout.sh 900 dist/Prism.app/Contents/MacOS/Prism --screenshot-tour "$RUNNER_TEMP/shots"
      - name: Crash reports
        if: failure()
        run: |
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name 'Prism*' -mmin -60 2>/dev/null | while read -r f; do
            echo "===== $f"; head -c 12000 "$f"; echo
          done
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: screenshots-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          retention-days: 5
          if-no-files-found: ignore

  release:
    name: Release
    needs: [linux, macos]
    if: github.ref == 'refs/heads/main' && (contains(github.event.head_commit.message, '[release]') || inputs.release)
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          if [ -d /Applications/Xcode_26.6.app ]; then sudo xcode-select -s /Applications/Xcode_26.6.app; fi
          swift --version
      - uses: actions/cache/restore@v4
        with:
          path: .build
          key: macos-spm-${{ hashFiles('Package.resolved') }}-${{ github.sha }}
          restore-keys: macos-spm-${{ hashFiles('Package.resolved') }}-
      - name: Signing identity
        env:
          PRISM_SIGNING_P12: ${{ secrets.PRISM_SIGNING_P12 }}
          PRISM_SIGNING_PASSWORD: ${{ secrets.PRISM_SIGNING_PASSWORD }}
        run: scripts/ci-import-signing.sh
      - name: Build universal release
        run: scripts/build_app.sh --release --universal --version "$PRISM_VERSION" --build "$PRISM_BUILD"
      - name: Self-test (release build)
        run: scripts/mac-timeout.sh 300 dist/Prism.app/Contents/MacOS/Prism --self-test
      - name: Package
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent Prism.app Prism.zip
          shasum -a 256 Prism.zip | tee Prism.zip.sha256
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease && 'true' || 'false' }}
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          Install or update on your Mac by pasting this into Terminal:

          \`\`\`
          curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/main/scripts/install.sh | bash
          \`\`\`

          Universal app (Apple silicon + Intel), macOS 14 Sonoma or newer.
          EOF
          if [ "$PRERELEASE" = "true" ]; then
            flags=(--prerelease --title "Prism $PRISM_VERSION (preview)")
          else
            flags=(--latest --title "Prism $PRISM_VERSION")
          fi
          gh release create "v$PRISM_VERSION" dist/Prism.zip dist/Prism.zip.sha256 \
            --target "$GITHUB_SHA" "${flags[@]}" --notes-file "$RUNNER_TEMP/notes.md"

  # Install the just-published release exactly the way a user would (the curl one-liner), on
  # Apple silicon and on Intel, then make sure the installed app is intact and actually runs.
  install-test:
    name: Install · ${{ matrix.os }}
    needs: release
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      # (the `env` context isn't available here; this is the same value as PRISM_VERSION)
      PRISM_DOWNLOAD_URL: https://github.com/${{ github.repository }}/releases/download/v0.9.${{ github.run_number }}/Prism.zip
      PRISM_NO_OPEN: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Run the installer one-liner
        run: |
          sw_vers; uname -m
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/install.sh" | bash
          test -x /Applications/Prism.app/Contents/MacOS/Prism
      - name: Inspect the installed app
        run: |
          APP=/Applications/Prism.app
          lipo -archs "$APP/Contents/MacOS/Prism" | tee "$RUNNER_TEMP/archs.txt"
          grep -q arm64 "$RUNNER_TEMP/archs.txt" && grep -q x86_64 "$RUNNER_TEMP/archs.txt"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dr - "$APP"
          defaults read "$APP/Contents/Info" CFBundleShortVersionString
          du -sh "$APP"
      - name: Self-test (installed app)
        run: scripts/mac-timeout.sh 300 /Applications/Prism.app/Contents/MacOS/Prism --self-test
      - name: Launch like a user and quit
        run: |
          mkdir -p "$RUNNER_TEMP/shots"
          open /Applications/Prism.app
          for _ in $(seq 1 40); do pgrep -x Prism >/dev/null && break; sleep 0.5; done
          sleep 12
          pgrep -x Prism >/dev/null || { echo "Prism is not running 12 s after launch"; exit 1; }
          screencapture -x "$RUNNER_TEMP/shots/installed-launch.png" || true
          pkill -TERM -x Prism || true
          for _ in $(seq 1 20); do pgrep -x Prism >/dev/null || break; sleep 0.5; done
          if pgrep -x Prism >/dev/null; then echo "Prism did not quit on SIGTERM"; pkill -KILL -x Prism; exit 1; fi
      - name: Re-run the installer over the existing copy (update path)
        run: |
          curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/scripts/install.sh" | bash
          codesign --verify --deep --strict /Applications/Prism.app
      - name: Crash reports
        if: failure()
        run: |
          find ~/Library/Logs/DiagnosticReports /Library/Logs/DiagnosticReports -name 'Prism*' -mmin -60 2>/dev/null | while read -r f; do
            echo "===== $f"; head -c 12000 "$f"; echo
          done
      - uses: actions/upload-artifact@v4
        if: success() || failure()
        with:
          name: install-${{ matrix.os }}
          path: ${{ runner.temp }}/shots
          retention-days: 5
          if-no-files-found: ignore
