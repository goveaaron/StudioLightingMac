name: Runner probe
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe.yml'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15, macos-latest, macos-27]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: System info
        run: |
          sw_vers || true
          uname -a
          sysctl -n machdep.cpu.brand_string || true
          sysctl -n hw.ncpu || true
          echo "--- Xcodes"
          ls -d /Applications/Xcode*.app || true
          echo "--- selected"
          xcode-select -p || true
          xcodebuild -version || true
          swift --version || true
          echo "--- SDKs"
          xcodebuild -showsdks 2>/dev/null | head -30 || true
          echo "--- tools"
          which iconutil sips screencapture codesign brew || true
      - name: Screencapture test
        continue-on-error: true
        run: |
          screencapture -x /tmp/shot.png && ls -la /tmp/shot.png || echo "screencapture failed"
