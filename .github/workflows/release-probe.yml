name: Release probe

# Temporary diagnostic: which ways of creating a release tag work with the Actions token when
# the tagged commit touches .github/workflows (GitHub then demands the `workflows` scope, which
# GITHUB_TOKEN can never have). Safe: every probe tag/release it creates is deleted again.

on: workflow_dispatch

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Probe
        env:
          GH_TOKEN: ${{ github.token }}
          R: ${{ github.repository }}
        run: |
          set +e
          N="probe-$GITHUB_RUN_ID"
          OLD=$(git log --format=%H -n 1 -- Sources)   # newest commit that touched Sources
          echo "GITHUB_SHA=$GITHUB_SHA (touches workflows: $(git show --name-only --format= $GITHUB_SHA | grep -c '^.github/workflows'))"
          echo "OLD=$OLD (touches workflows: $(git show --name-only --format= $OLD | grep -c '^.github/workflows'))"
          cleanup() { # $1 tag
            id=$(gh api "repos/$R/releases/tags/$1" -q .id 2>/dev/null)
            [ -n "$id" ] && gh api -X DELETE "repos/$R/releases/$id" >/dev/null && echo "   (deleted release)"
            gh api -X DELETE "repos/$R/git/refs/tags/$1" >/dev/null 2>&1 && echo "   (deleted tag)"
          }
          report() { echo "== $1: $2"; }

          # A: release API with target_commitish = sha
          for which in GITHUB_SHA OLD; do
            sha=${!which}; t="$N-a-$which"
            out=$(gh api -X POST "repos/$R/releases" -f tag_name="$t" -f target_commitish="$sha" -F prerelease=true -f name="$t" 2>&1)
            report "A release+target $which" "$(echo "$out" | head -c 160)"; cleanup "$t"
          done
          # B: refs API, then release on the existing tag
          for which in GITHUB_SHA OLD; do
            sha=${!which}; t="$N-b-$which"
            out=$(gh api -X POST "repos/$R/git/refs" -f ref="refs/tags/$t" -f sha="$sha" 2>&1)
            report "B refs API $which" "$(echo "$out" | head -c 160)"
            out=$(gh api -X POST "repos/$R/releases" -f tag_name="$t" -F prerelease=true -f name="$t" 2>&1)
            report "B release on existing tag $which" "$(echo "$out" | head -c 160)"; cleanup "$t"
          done
          # C: git push of a tag, then release on the existing tag
          for which in GITHUB_SHA OLD; do
            sha=${!which}; t="$N-c-$which"
            git tag "$t" "$sha"
            out=$(git push origin "refs/tags/$t" 2>&1)
            report "C git push $which" "$(echo "$out" | tail -2 | head -c 200)"
            out=$(gh api -X POST "repos/$R/releases" -f tag_name="$t" -F prerelease=true -f name="$t" 2>&1)
            report "C release on existing tag $which" "$(echo "$out" | head -c 160)"; cleanup "$t"
          done
          # D: release API without target (default branch head)
          t="$N-d"
          out=$(gh api -X POST "repos/$R/releases" -f tag_name="$t" -F prerelease=true -f name="$t" 2>&1)
          report "D release, no target" "$(echo "$out" | head -c 160)"; cleanup "$t"
          exit 0
